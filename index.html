<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>need key</title>
    
    <!-- 🔒 核心安全防护：内容安全策略 (CSP) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
    
    <style>
        /* 全局样式 */
        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.3s ease; }
        body { font-family: sans-serif; background-color: #f0f0f0; overflow: hidden; height: 100vh; display: flex; }

        /* 密码弹窗与模糊背景 */
        #mask { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); background-color: rgba(240, 240, 240, 0.3); }
        #popup { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: white; padding: 50px 60px; border-radius: 16px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); z-index: 1001; 
            text-align: center; display: flex; flex-direction: column; align-items: center; 
            min-width: 320px; 
        }
        #popup h2 { margin-bottom: 25px; font-size: 24px; color: #333; } 
        #popup h6 { margin-bottom: 35px; font-size: 14px; color: #666; font-weight: normal; line-height: 1.6; } 
        
        /* 输入框容器 */
        .input-wrapper { position: relative; width: 100%; max-width: 280px; margin-bottom: 25px; }
        input { 
            padding: 15px; font-size: 16px; border: 2px solid #eee; border-radius: 8px; 
            outline: none; width: 100%; text-align: center; transition: border-color 0.3s;
        }
        input:focus { border-color: #333; }
        
        /* SVG 小眼睛样式 */
        .toggle-eye {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            cursor: pointer; width: 22px; height: 22px; color: #999; user-select: none;
        }
        .toggle-eye:hover { color: #333; }
        .toggle-eye svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        button { 
            padding: 12px 40px; font-size: 16px; background-color: #333; color: white; 
            border: none; border-radius: 8px; cursor: pointer; width: 100%; max-width: 280px; user-select: none;
        }
        button:hover { background-color: #555; }
        .hidden { opacity: 0; pointer-events: none; }

        /* 侧边栏与内容区 */
        #sidebar { width: 200px; height: 100vh; background-color: #333; color: white; display: none; flex-direction: column; padding-top: 20px; flex-shrink: 0; }
        #sidebar.collapsed { width: 60px; }
        #sidebar.collapsed .nav-title, #sidebar.collapsed .nav-text { display: none; }
        .nav-header { display: flex; align-items: center; padding: 0 15px 15px 15px; border-bottom: 1px solid #444; }
        .toggle-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding: 5px; margin-right: 10px; }
        .nav-item { padding: 15px 20px; cursor: pointer; display: flex; align-items: center; white-space: nowrap; }
        .nav-item:hover { background-color: #444; }
        .nav-item.active { background-color: #555; border-left: 4px solid #fff; }
        .nav-icon { margin-right: 10px; font-size: 18px; }

        #content-area { flex: 1; height: 100vh; display: none; position: relative; background-color: #f0f0f0; overflow: hidden; }
        .page { display: none; padding: 40px; height: 100%; overflow-y: auto; }
        .page.active { display: block; }
        #game-container { width: 100%; height: 100%; background: black; position: relative; }
        canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
    </style>
</head>
<body>

    <!-- 登录弹窗 -->
    <div id="mask"></div>
    <div id="popup">
        <h2>🔒 请输入密码</h2>
        <h6>提示:密码为汪老师视频结尾的摩斯密码🤫</h6>
        
        <div class="input-wrapper">
            <input type="password" id="passwordInput" placeholder="输入密码解锁" autocomplete="off">
            <!-- 默认闭眼 (隐藏状态) -->
            <span class="toggle-eye" id="toggleEye">
                <svg id="eyeClosed" viewBox="0 0 24 24">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
                <!-- 睁眼 (显示状态) -->
                <svg id="eyeOpen" viewBox="0 0 24 24" style="display: none;">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </span>
        </div>
        
        <button id="unlockBtn">解锁</button>
        <p id="errorMsg" style="color: red; margin-top: 15px; display: none; font-size: 14px;">密码错误，请重试！</p>
    </div>

    <!-- 侧边栏 -->
    <div id="sidebar">
        <div class="nav-header">
            <button class="toggle-btn" id="toggleBtn">☰</button>
            <div class="nav-title">导航菜单</div>
        </div>
        <div class="nav-item active" data-page="home">
            <span class="nav-icon">🏠</span><span class="nav-text">主页</span>
        </div>
        <div class="nav-item" data-page="game">
            <span class="nav-icon">🎆</span><span class="nav-text">烟花游戏</span>
        </div>
    </div>

    <!-- 内容区 -->
    <div id="content-area">
        <div id="home" class="page active">
            <h1>欢迎来到我的网站！</h1>
            <p style="margin-top: 20px; font-size: 18px;">由笑脸制作</p>
            <p style="margin-top: 10px;">抖音号: 60312219015</p>
            <p style="margin-top: 10px;">GitHub名: chuying1-git</p>
            <p style="margin-top: 30px; color: #666;">👉 点击左侧的【烟花游戏】体验网页版烟花特效！</p>
        </div>
        <div id="game" class="page">
            <div id="game-container"><canvas id="fireworksCanvas"></canvas></div>
        </div>
    </div>

    <script>
        "use strict";
        // 安全防御层
        try { if (window.top !== window.self) window.top.location = window.self.location; } catch (e) {}
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());

        // 业务逻辑
        const correctPassword = "2zhouniankuaile"; 
        const errorMsg = document.getElementById('errorMsg');
        const passwordInput = document.getElementById('passwordInput');
        const toggleEye = document.getElementById('toggleEye');
        const eyeOpen = document.getElementById('eyeOpen');
        const eyeClosed = document.getElementById('eyeClosed');
        let gameInitialized = false;
        let resizeGameCanvas = null;

        // 眼睛切换逻辑：闭眼(隐藏) -> 点击 -> 睁眼(显示)
        toggleEye.addEventListener('mousedown', (e) => {
            e.preventDefault(); 
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeClosed.style.display = 'none';
                eyeOpen.style.display = 'block';
            } else {
                passwordInput.type = 'password';
                eyeClosed.style.display = 'block';
                eyeOpen.style.display = 'none';
            }
        });

        // 验证逻辑
        function checkPassword() {
            const popup = document.getElementById('popup');
            if (passwordInput.value === correctPassword) {
                popup.classList.add('hidden');
                document.getElementById('mask').classList.add('hidden');
                errorMsg.style.display = 'none';
                document.getElementById('sidebar').style.display = 'flex';
                document.getElementById('content-area').style.display = 'block';
            } else {
                popup.style.transform = "translate(-50%, -50%) translateX(10px)";
                setTimeout(() => {
                    popup.style.transform = "translate(-50%, -50%) translateX(-10px)";
                    setTimeout(() => {
                        popup.style.transform = "translate(-50%, -50%)";
                        passwordInput.value = ""; 
                        errorMsg.style.display = 'block'; 
                    }, 100);
                }, 100);
            }
        }
        
        document.getElementById('unlockBtn').addEventListener('click', checkPassword);
        passwordInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') checkPassword(); });

        // 侧边栏与页面切换
        document.getElementById('toggleBtn').addEventListener('click', function() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
            if (gameInitialized && typeof resizeGameCanvas === 'function') resizeGameCanvas();
        });

        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                this.classList.add('active');
                const pageId = this.getAttribute('data-page');
                document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
                document.getElementById(pageId).classList.add('active');
                if (pageId === 'game' && !gameInitialized) initFireworks();
                else if (pageId === 'game' && typeof resizeGameCanvas === 'function') resizeGameCanvas();
            });
        });

        // 烟花游戏
        function initFireworks() {
            const canvas = document.getElementById('fireworksCanvas');
            const ctx = canvas.getContext('2d');
            let particles = [], rockets = [];
            gameInitialized = true;
            resizeGameCanvas = function() {
                canvas.width = canvas.parentElement.clientWidth;
                canvas.height = canvas.parentElement.clientHeight;
            };
            resizeGameCanvas();
            window.addEventListener('resize', resizeGameCanvas);

            function randColor() { return `rgb(${Math.floor(Math.random()*205+50)},${Math.floor(Math.random()*205+50)},${Math.floor(Math.random()*205+50)})`; }
            function launch(x, y) { rockets.push({x:x,y:canvas.height,tx:x,ty:y,color:randColor()}); }
            function explode(x, y, color) {
                for (let i = 0; i < 80; i++) {
                    const angle = Math.random()*2*Math.PI, speed = Math.random()*5+1;
                    particles.push({x:x,y:y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,color:color,life:60});
                }
            }
            canvas.addEventListener('mousedown', (e) => {
                const rect = canvas.getBoundingClientRect();
                launch(e.clientX-rect.left, e.clientY-rect.top);
            });
            function animate() {
                ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(0,0,canvas.width,canvas.height);
                for (let i = rockets.length-1; i >= 0; i--) {
                    const r = rockets[i], dx = r.tx-r.x, dy = r.ty-r.y, dist = Math.sqrt(dx*dx+dy*dy);
                    if (dist < 15) { explode(r.tx,r.ty,r.color); rockets.splice(i,1); }
                    else { r.x += (dx/dist)*15; r.y += (dy/dist)*15; ctx.beginPath(); ctx.arc(r.x,r.y,3,0,Math.PI*2); ctx.fillStyle='white'; ctx.fill(); }
                }
                for (let i = particles.length-1; i >= 0; i--) {
                    const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.vx *= 0.95; p.vy *= 0.95; p.life--;
                    ctx.globalAlpha = p.life/60; ctx.beginPath(); ctx.arc(p.x,p.y,2,0,Math.PI*2); ctx.fillStyle=p.color; ctx.fill(); ctx.globalAlpha=1.0;
                    if (p.life <= 0) particles.splice(i,1);
                }
                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
</body>
</html>
