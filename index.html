<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>need key</title>

  <style>
    /* ---------- 基础修复 ---------- */
    input[type="password"]::-webkit-credentials-auto-fill-button,
    input[type="password"]::-webkit-contacts-auto-fill-button,
    input[type="password"]::-ms-reveal {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
      height: 0 !important;
      width: 0 !important;
      margin: 0 !important;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: all 0.25s ease;
    }

    html, body {
      height: 100%;
      background: #f0f0f0;
      font-family: sans-serif;
    }

    body {
      overflow: hidden;
      display: flex;
      min-height: 100vh;
    }

    #sidebar {
      width: 200px;
      height: 100vh;
      background-color: #333;
      color: white;
      display: flex;
      flex-direction: column;
      padding-top: 20px;
      flex-shrink: 0;
    }

    #sidebar.collapsed { width: 60px; }
    #sidebar.collapsed .nav-title, #sidebar.collapsed .nav-text { display:none; }

    .nav-header { display:flex; align-items:center; padding:0 15px 15px 15px; border-bottom:1px solid #444; }
    .toggle-btn { background:none; border:none; color:white; font-size:24px; cursor:pointer; padding:5px; margin-right:10px; }
    .nav-item { padding:15px 20px; cursor:pointer; display:flex; align-items:center; white-space:nowrap; }
    .nav-item:hover { background-color:#444; }
    .nav-item.active { background-color:#555; border-left:4px solid #fff; }
    .nav-icon { margin-right:10px; font-size:18px; }

    /* Sidebar lock area */
    #sidebarLock { padding:12px 16px; border-bottom:1px solid rgba(255,255,255,0.03); }
    #sidebarLock h6 { font-size:13px; color:#ccc; margin-bottom:8px; }
    #sidebarLock .pw-inline { display:flex; gap:8px; align-items:center; }
    #sidebarLock input { padding:8px; border-radius:6px; border:1px solid #555; background:#222; color:#fff; flex:1; }
    #sidebarLock button { padding:8px 10px; border-radius:6px; background:#555; border:none; color:#fff; cursor:pointer; }

    #content-area { flex:1; height:100vh; display:none; position:relative; background-color:#f0f0f0; overflow:hidden; padding-bottom:42px; }
    .page { display:none; padding:40px; height:100%; overflow-y:auto; }
    .page.active { display:block; }

    /* board, videos, other styles preserved (shortened) */
    .video-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px; }
    .video-card { background:white; border-radius:12px; overflow:hidden; box-shadow:0 4px 15px rgba(0,0,0,0.05); }
    .video-card video { width:100%; height:180px; object-fit:cover; }

    #board { width:480px; height:480px; display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr); border:1px solid #ccc; background:#fff; }
    #board > div { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:36px; }

    #site-footer { position:fixed; left:0; right:0; bottom:0; height:42px; background:#222; color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; z-index:2000; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/chess.js@0.12.0/chess.min.js"></script>
</head>
<body>

  <!-- Sidebar with embedded unlock control (password moved here) -->
  <div id="sidebar">
    <div class="nav-header">
      <button class="toggle-btn" id="toggleBtn">☰</button>
      <div class="nav-title">导航菜单</div>
    </div>

    <div id="sidebarLock">
      <h6>提示: 请输入开门密码（摩斯码线索见视频结尾）</h6>
      <div class="pw-inline">
        <input type="password" id="sidebarPassword" placeholder="侧栏密码" autocomplete="new-password">
        <button id="sidebarUnlockBtn">解锁</button>
      </div>
      <div style="margin-top:8px; font-size:12px; color:#bbb; display:flex; justify-content:space-between; align-items:center;">
        <div id="sidebarLockStatus">未解锁</div>
        <div style="opacity:0.8; font-size:11px;">敬请期待页面</div>
      </div>
    </div>

    <div class="nav-item active" data-page="home"><span class="nav-icon">🏠</span><span class="nav-text">主页</span></div>
    <div class="nav-item" data-page="game"><span class="nav-icon">🎆</span><span class="nav-text">烟花游戏</span></div>
    <div class="nav-item" data-page="videos"><span class="nav-icon">🎬</span><span class="nav-text">视频展览</span></div>
    <div class="nav-item" data-page="visitors"><span class="nav-icon">👥</span><span class="nav-text">访客统计</span></div>
    <div class="nav-item" data-page="chess"><span class="nav-icon">♟️</span><span class="nav-text">象棋</span></div>
    <div class="nav-item" data-page="adventure"><span class="nav-icon">🕳️</span><span class="nav-text">后室探险模拟器</span></div>
  </div>

  <div id="content-area">
    <div id="home" class="page active">
      <h1 id="homeHeading">欢迎来到我的网站！</h1>
      <p style="margin-top:12px; color:#666;">（本页将在解锁后显示 “敬请期待”）</p>
    </div>

    <div id="game" class="page"><div id="game-container"><canvas id="fireworksCanvas"></canvas></div></div>

    <div id="videos" class="page">
      <div class="video-grid">
        <div class="video-card">
          <video controls preload="metadata" playsinline>
            <source src="https://cdn.jsdelivr.net/gh/chuying1-git/need-key@main/0000-0144.mp4" type="video/mp4">
            <source src="https://raw.githubusercontent.com/chuying1-git/need-key/main/0000-0144.mp4" type="video/mp4">
          </video>
        </div>
        <div class="video-card">
          <video controls preload="metadata" playsinline>
            <source src="https://cdn.jsdelivr.net/gh/chuying1-git/need-key@main/1791258589883.mp4" type="video/mp4">
            <source src="https://raw.githubusercontent.com/chuying1-git/need-key/main/1791258589883.mp4" type="video/mp4">
          </video>
        </div>
      </div>
    </div>

    <div id="visitors" class="page">
      <div id="visitorLocked" class="visitor-box">
        <p class="muted">此页面受保护，需要输入分析密码才能查看访客详情。</p>
        <div style="margin-top:12px;" class="pw-inline">
          <input type="password" id="analyticsPassword" placeholder="输入分析密码解锁" autocomplete="new-password">
          <button id="analyticsUnlockBtn" style="padding:8px 16px;max-width:140px;">查看</button>
        </div>
      </div>

      <div id="visitorContent" class="visitor-box" style="margin-top:20px; display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div class="visitor-count" id="visitorCount">0</div>
            <div class="muted">当前在线（近似）</div>
          </div>
        </div>
        <div class="visitor-list" id="visitorList" style="margin-top:12px;"></div>
      </div>
    </div>

    <div id="adventure" class="page"><p>后室探险模拟器（外部嵌入）</p></div>

    <div id="chess" class="page">
      <div style="display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap;">
        <div id="boardWrapper" style="flex:0 0 480px;"><div id="board"></div></div>
      </div>
    </div>
  </div>

  <div id="site-footer"><span class="txt" id="lastUpdated">最近更新: --</span></div>

  <script>
    // 密码混淆数据（保留原有机制）
    const _pwKey = 23;
    const _mainPwArr = [37,109,127,120,98,121,126,118,121,124,98,118,126,123,114];
    const _analysisPwArr = [116,127,98,110,126,121,112,33,32];

    function verifyObf(inputStr, obfArr){
      if(!inputStr || typeof inputStr !== 'string') return false;
      if(inputStr.length !== obfArr.length) return false;
      for(let i=0;i<inputStr.length;i++){ const c = inputStr.charCodeAt(i) ^ _pwKey; if(c !== obfArr[i]) return false; }
      return true;
    }

    function updateLastUpdated(){ const el=document.getElementById('lastUpdated'); let txt=document.lastModified; if(!txt||txt==='') txt=new Date().toLocaleString(); el.textContent='最近更新: '+txt; }

    function initMainPage(){
      window.VISITOR_WS_URL='ws://localhost:8080';
      document.addEventListener('contextmenu', e=>e.preventDefault());
      document.addEventListener('dragstart', e=>e.preventDefault());

      // Show sidebar by default, content hidden until sidebar unlock
      document.getElementById('sidebar').style.display='flex';
      document.getElementById('content-area').style.display='none';

      const sidebarPassword = document.getElementById('sidebarPassword');
      const sidebarUnlockBtn = document.getElementById('sidebarUnlockBtn');
      const sidebarLockStatus = document.getElementById('sidebarLockStatus');

      sidebarUnlockBtn.addEventListener('click', function(){
        if(verifyObf(sidebarPassword.value, _mainPwArr)){
          // unlocked: show content-area and set home to 敬请期待
          document.getElementById('content-area').style.display='block';
          document.getElementById('homeHeading').textContent='敬请期待';
          sidebarLockStatus.textContent='已解锁';
          // optionally clear password
          sidebarPassword.value='';
        } else {
          sidebarLockStatus.textContent='密码错误';
          setTimeout(()=> sidebarLockStatus.textContent='未解锁', 1500);
          sidebarPassword.value='';
        }
      });

      // enable Enter key
      sidebarPassword.addEventListener('keypress', function(e){ if(e.key==='Enter') sidebarUnlockBtn.click(); });

      // navigation
      document.getElementById('toggleBtn').addEventListener('click', function(){ document.getElementById('sidebar').classList.toggle('collapsed'); });
      document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', function(){
          document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
          this.classList.add('active');
          const pageId = this.getAttribute('data-page');
          document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
          const target = document.getElementById(pageId);
          if(target) target.classList.add('active');
        });
      });

      // visitors unlock uses existing analysis password check
      const analyticsUnlockBtn = document.getElementById('analyticsUnlockBtn');
      const analyticsPassword = document.getElementById('analyticsPassword');
      const visitorLocked = document.getElementById('visitorLocked');
      const visitorContent = document.getElementById('visitorContent');
      const visitorSourceEl = document.getElementById('visitorSource');

      analyticsUnlockBtn.addEventListener('click', function(){
        if(verifyObf(analyticsPassword.value, _analysisPwArr)){
          visitorLocked.style.display='none'; visitorContent.style.display='block'; analyticsPassword.value='';
        } else { alert('分析密码错误'); analyticsPassword.value=''; }
      });

      // other init tasks
      updateLastUpdated();
    }

    document.addEventListener('DOMContentLoaded', initMainPage);

    // minimal chess init to render board if user navigates to chess after unlocking
    document.addEventListener('DOMContentLoaded', function(){
      if(typeof Chess === 'undefined') return;
      // set up a basic board render so it won't be blank when user opens chess
      function renderEmptyBoard(){
        const boardEl = document.getElementById('board'); if(!boardEl) return;
        boardEl.innerHTML='';
        for(let r=0;r<8;r++){ for(let f=0;f<8;f++){ const div=document.createElement('div'); const isDark=(r+f)%2===0; div.style.background=isDark ? '#b58863':'#f0d9b5'; boardEl.appendChild(div); } }
      }
      renderEmptyBoard();
    });
  </script>
</body>
</html>
